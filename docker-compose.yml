services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: haven
      POSTGRES_USER: haven
      POSTGRES_PASSWORD: haven_local_password
    ports:
      - "5432:5432"
    volumes:
      - haven_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haven -d haven"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://haven:haven_local_password@db:5432/haven
      JWT_SECRET: local-only-change-this-secret-before-deploying-123456789
      DEMO_MODE: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  haven_pg:
